# Run backend API audit tests and frontend lint/build on push and PRs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fserp_ci
          POSTGRES_USER: fserp_ci
          POSTGRES_PASSWORD: fserp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fserp_ci -d fserp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fserp_ci:fserp_ci@127.0.0.1:5432/fserp_ci
      DJANGO_SECRET_KEY: ci-not-for-production-use-50chars-minimum-abcdefgh-123456
      FSERP_SKIP_MASTER_BOOTSTRAP: "1"
      FSERP_ALLOW_CONSOLE_EMAIL: "1"
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests (API audit, password reset, backup, …)
        run: python -m pytest tests/ -q --tb=short

      - name: Django deployment system check
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Regression checks
        run: npm test

      - name: Build
        run: npm run build
